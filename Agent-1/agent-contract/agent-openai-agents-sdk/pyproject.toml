[project]
name = "agent-server"
version = "0.3.0"
description = "Warranty Contract Agent — Streamlit frontend + AgentServer backend"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-openai>=0.13.0,<0.15.0",
    "databricks-agents>=1.9.3,<2.0.0",
    "mlflow>=3.10.0,<3.11.0",
    "openai-agents>=0.12.0,<0.13.0",
    "openai>=2.8.0,<3.0.0",
    "langgraph>=0.2.60,<0.4.0",
    "langsmith>=0.1.147,<0.4.0",
    "python-dotenv>=1.2.1",
    "litellm>=1.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dateutil>=2.9.0",
    "streamlit>=1.37.0",
    "requests>=2.31.0",
    "nest-asyncio>=1.6.0",
    "pypdf>=4.0.0",
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
    "extract-msg>=0.50.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
]


[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
discover-tools = "scripts.discover_tools:main"
